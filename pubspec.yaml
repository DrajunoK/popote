name: popote
description: Planifiez les repas à plusieurs, la liste de courses se fait toute seule.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  google_fonts: ^6.3.3
  image_picker: ^1.1.2
  intl: ^0.20.3
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
