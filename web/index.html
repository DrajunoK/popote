<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Planifiez les repas à plusieurs, et la liste de courses se fait toute seule.">
  <meta name="theme-color" content="#14161B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Popote">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Popote</title>
  <link rel="manifest" href="manifest.json">
  <!-- Installation PWA : Chrome envoie beforeinstallprompt une seule fois, on le garde pour le bouton de l'écran de connexion. -->
  <script>
    window.popoteInstall = {
      _event: null,
      onChange: null,
      available: function () { return !!this._event; },
      isStandalone: function () {
        return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      },
      isIos: function () {
        return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      },
      prompt: async function () {
        if (!this._event) return 'unavailable';
        this._event.prompt();
        var choice = await this._event.userChoice;
        this._event = null;
        if (this.onChange) this.onChange();
        return choice.outcome;
      }
    };
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.popoteInstall._event = e;
      if (window.popoteInstall.onChange) window.popoteInstall.onChange();
    });
    window.addEventListener('appinstalled', function () {
      window.popoteInstall._event = null;
      if (window.popoteInstall.onChange) window.popoteInstall.onChange();
    });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
